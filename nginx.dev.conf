events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # === /bassin/* → Angular dev server (port 4200) ===
        location /bassin/ {
            proxy_pass http://host.docker.internal:4200/bassin/;
            proxy_http_version 1.1;

            # WebSocket support (pour HMR / Live Reload Angular)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Désactive le buffering pour le streaming temps réel
            proxy_buffering off;
        }

        # === /muscu/* → Vite dev server (port 3000) ===
        location /muscu/ {
            proxy_pass http://host.docker.internal:3000/muscu/;
            proxy_http_version 1.1;

            # WebSocket support (pour HMR Vite)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
        }

        # === Page d'accueil ===
        location = / {
            add_header Content-Type text/html;
            return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Gateway Dev</title></head><body style="font-family:sans-serif;padding:40px;"><h1>Gateway Dev</h1><ul><li><a href="/bassin/">Bassin</a></li><li><a href="/muscu/">Muscu</a></li></ul></body></html>';
        }

        # === 404 sur /navbar/* ===
        location /navbar/ {
            return 404;
        }
    }
}